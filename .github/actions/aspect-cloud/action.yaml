name: Aspect Cloud for vanilla Bazel
description: |
  Point plain `bazel` invocations at Aspect Cloud's remote cache and BES.

  Writes the *user* bazelrc, so it reaches every workspace on the runner —
  each examples/* tree is its own workspace that the repo's .bazelrc never
  applies to. Without a token it installs the launcher and nothing else.

inputs:
  aspect-api-token:
    description: '<CLIENT_ID>:<SECRET> Aspect API token. Empty disables everything below.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Ungated: integration-test's bats fixtures call `aspect lint`. Only the
    # login needs the token.
    - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
      with:
        aspect-api-token: ${{ inputs.aspect-api-token }}
        # Superseded by the remote cache; setup-aspect defaults them on.
        bazelisk-cache: 'false'
        disk-cache: 'false'
        repository-cache: 'false'

    - name: Configure Aspect Cloud
      if: inputs.aspect-api-token != ''
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        case "$EVENT_NAME" in
          pull_request|pull_request_target) run_type=PULL_REQUEST ;;
          schedule)                         run_type=SCHEDULED ;;
          workflow_dispatch)                run_type=MANUAL ;;
          *)                                run_type=BRANCH_PUSH ;;
        esac

        # Bazel splits rc lines on whitespace, so values are quoted.
        meta() {
          printf 'common --build_metadata="%s=%s"\n' "$1" "$(printf '%s' "$2" | tr -d '"' | tr '\n' ' ')"
        }

        cd "$GITHUB_WORKSPACE"

        # checkout leaves HEAD on the PR's synthetic merge commit, whose author
        # and message describe the merge rather than the change under test. The
        # head commit is not in the shallow clone, so fetch it.
        sha=$(git rev-parse HEAD)
        if [ -n "$HEAD_SHA" ]; then
          git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null \
            || git fetch --depth=1 --quiet origin "$HEAD_SHA" 2>/dev/null \
            || true
          if git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            sha=$HEAD_SHA
          fi
        fi
        {
          # setup-bazel leaves no trailing newline, so start one.
          echo
          echo "try-import $GITHUB_WORKSPACE/.aspect/bazelrc"
          echo "common --config=aspect-cloud"
          meta CI_HOST GITHUB_ACTIONS
          meta VCS GITHUB
          meta RUN_TYPE "$run_type"
          meta REPO_OWNER "${GITHUB_REPOSITORY%%/*}"
          meta REPO_NAME "${GITHUB_REPOSITORY#*/}"
          meta REPO_URL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          meta BUILD_URL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          meta USER "$GITHUB_ACTOR"
          meta BRANCH_NAME "$BRANCH_NAME"
          meta COMMIT_SHA "$sha"
          meta COMMIT_AUTHOR_NAME "$(git show -s --format=%an "$sha")"
          meta COMMIT_AUTHOR_EMAIL "$(git show -s --format=%ae "$sha")"
          meta COMMIT_AUTHOR "$(git show -s --format='%an <%ae>' "$sha")"
          meta COMMIT_MESSAGE "$(git show -s --format=%s "$sha")"
          meta COMMIT_TIMESTAMP "$(git show -s --format=%aI "$sha")"
          meta BUILD_USER "$GITHUB_ACTOR"
          meta BUILD_HOST "${RUNNER_NAME:-}"
          case "$GITHUB_REF" in refs/tags/*) meta COMMIT_TAG "${GITHUB_REF#refs/tags/}" ;; esac
          if [ -n "$PR_NUMBER" ]; then
            meta PR_NUMBER "$PR_NUMBER"
            meta PR_ID "$PR_NUMBER"
            meta PR_SOURCE_BRANCH_NAME "$GITHUB_HEAD_REF"
            meta PR_TARGET_BRANCH_NAME "$GITHUB_BASE_REF"
          fi
        } >> "$HOME/.bazelrc"
